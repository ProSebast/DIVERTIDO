<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Días Grises ☁️</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Ni idea de por qué puse esto pero se ve bonito -->
    <div class="floating-hearts" id="floatingHearts"></div>

    <!-- El coso este para que sepa que tiene el volumen a tope -->
    <div class="volume-indicator" id="volumeIndicator">🔊 Volumen: <span id="volumeLevel">50</span>%</div>

    <div class="container" id="mainContainer">
        <div class="header">
            <h1 class="main-title" id="mainTitle">Estas Lista!!!</h1>
            <p class="intro-text">Esto es algo especialmente para ti Dani</p>
            <p class="intro-text">Para esos dias grises donde tengas dos patas izquierda ay, he creado esto!!! para ti</p>
            <p class="intro-text">Espero que te guste y te entretenga</p>
            <p class="intro-text">Esta paguina esta llena de misterios…<br>no solo en los botones 👀</p>
        </div>

        <div class="buttons-container">
            <button class="btn" onclick="showRandom()">
                <span style="position: relative; z-index: 1;">random</span>
            </button>
            <button class="btn" onclick="showHistorias()">
                <span style="position: relative; z-index: 1;">historias chistoas mia</span>
            </button>
            <button class="btn" onclick="showMalDia()">
                <span style="position: relative; z-index: 1;">si hoy fue un mal dia</span>
            </button>
            <button class="btn" onclick="showMensajeDia()">
                <span style="position: relative; z-index: 1;">mensaje del dia</span>
            </button>
            <button class="btn" onclick="showRecuerda()">
                <span style="position: relative; z-index: 1;">recuerda quien eres</span>
            </button>
            <button class="btn" onclick="showMusica()">
                <span style="position: relative; z-index: 1;">musica que podria gustarte</span>
            </button>
        </div>

        <div id="contentArea" class="content-area"></div>
    </div>

    <!-- Botón que no se ve porque soy un genio incomprendido -->
    <div class="invisible-button" onclick="showSecretMessage()" title="👀"></div>
    
    <!-- El cuadrito que sale cuando tocas algo que no debes -->
    <div id="secretMessage" class="secret-message"></div>

    <script src="script.js"></script>
</body>
</html>
